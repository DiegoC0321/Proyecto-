<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f7fa;
            --surface: #FCFCBB;
            --surface2: #fafbfc;
            --border: #eef1f6;
            --border-focus: #e2f3e2;
            
            --text: #3a4354;
            --muted: #6b7280;
            
            --accent-pastel: #cbdcf7;
            --accent-text: #4a6fa5;
            --accent-hover: #b8cff5;
            
            --success-text: #437043;
            
            --error-bg: #fce7e3;
            --error-border: #f7ced6;
            --error-text: #a84c4c;
            
            --link-color: #557fa8;
        }

        body {
            font-family: 'Sora', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            
            /* Alineación a la izquierda idéntica al Login */
            justify-content: flex-start; 
            padding: 2rem 1.5rem 2rem 10%;
            
            /* Configuración del Fondo */
            background-color: var(--bg);
            background-image: url('/img/fondo.jpg');
            background-repeat: no-repeat;
            background-position: right center;
            background-size: contain;
            background-attachment: fixed;
        }

        .wrapper {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .brand-name {
            font-size: 1.4rem; 
            font-weight: 700;
            color: var(--text);
        }
        .brand-tagline { font-size: 0.85rem; color: var(--muted); margin-top: 0.2rem; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(160, 175, 195, 0.15);
        }

        .card-header { margin-bottom: 1.5rem; text-align: center; }
        .card-title { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--text); }
        .card-subtitle { font-size: 0.85rem; color: var(--muted); }

        .alert-error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
            font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 1.25rem;
        }
        .alert-error svg { width: 14px; height: 14px; flex-shrink: 0; }

        /* Estructura limpia de filas */
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .form-group { width: 100%; }

        label {
            display: block;
            font-size: 0.8rem; font-weight: 500;
            color: var(--text);
            margin-bottom: 0.45rem;
        }

        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--muted); pointer-events: none;
            display: flex;
        }
        .input-icon svg { width: 16px; height: 16px; }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            color: var(--text);
            font-family: 'Sora', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: #b3c8f2;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(203, 220, 247, 0.4);
        }
        input::placeholder { color: #b0bac9; }

        .show-pass {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: var(--muted); padding: 4px; display: flex;
        }
        .show-pass svg { width: 16px; height: 16px; }

        /* Password strength */
        .strength-bar {
            display: flex; gap: 4px; margin-top: 6px;
        }
        .strength-seg {
            height: 3px; flex: 1; border-radius: 2px;
            background: rgba(0,0,0,0.05);
            transition: background 0.3s;
        }
        .strength-label {
            font-size: 0.75rem; color: var(--muted); margin-top: 4px;
        }

        .btn-primary {
            width: 100%; padding: 0.85rem;
            background: var(--accent-pastel);
            border: 1px solid rgba(0,0,0,0.03); border-radius: 10px;
            color: var(--accent-text); font-family: 'Sora', sans-serif;
            font-size: 0.95rem; font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:active { transform: scale(0.99); }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 1.25rem 0; color: var(--muted); font-size: 0.8rem;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .login-link {
            text-align: center; font-size: 0.85rem; color: var(--muted);
        }
        .login-link a { color: var(--link-color); text-decoration: none; font-weight: 500; }
        .login-link a:hover { text-decoration: underline; }


        @media (max-width: 768px) {
            body { 
                justify-content: center; 
                padding: 1.5rem; 
                background-position: center;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">


        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Crear cuenta</h2>
                <p class="card-subtitle">Comienza a organizar tus proyectos académicos hoy</p>
            </div>

            <div class="alert-error" th:if="${error}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span th:text="${error}">El correo ya está registrado.</span>
            </div>

            <form th:action="@{/registro}" method="post" th:object="${usuario}" id="regForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <div class="input-wrap">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </span>
                            <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: María García" required autocomplete="name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo institucional</label>
                        <div class="input-wrap">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            </span>
                            <input type="email" id="correo" th:field="*{correo}" placeholder="@gmail.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="contrasena">Contraseña</label>
                        <div class="input-wrap">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                            </span>
                            <input type="password" id="contrasena" th:field="*{contrasena}" placeholder="Mínimo 8 caracteres" minlength="8" required autocomplete="new-password" oninput="checkStrength(this.value)">
                            <button type="button" class="show-pass" onclick="togglePass()" aria-label="Mostrar contraseña">
                                <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <br>
                        

                        <div class="strength-label" id="strength-text"></div>
                    </div>
                </div>


                <button type="submit" class="btn-primary">Crear mi cuenta</button>
            </form>

            <div class="divider">¿ya tienes cuenta?</div>
            <p class="login-link"><a th:href="@{/login}">Iniciar sesión</a></p>

       
        </div>
    </div>

    <script>
        function togglePass() {
            const input = document.getElementById('contrasena');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }

        function checkStrength(val) {
            const segs = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3'), document.getElementById('s4')];
            const txt = document.getElementById('strength-text');
            const colors = ['#ef4444','#f97316','#eab308','#437043'];
            const labels = ['Muy débil','Débil','Moderada','Fuerte'];
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            segs.forEach((s, i) => {
                s.style.background = i < score ? colors[Math.min(score-1, 3)] : 'rgba(0,0,0,0.05)';
            });
            txt.textContent = val.length > 0 ? 'Seguridad: ' + labels[Math.max(score-1,0)] : '';
            txt.style.color = colors[Math.max(score-1,0)];
        }
    </script>
</body>
</html>
