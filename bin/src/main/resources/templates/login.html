<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f7fa;
            --surface: #FCFCBB;
            --surface2: #fafbfc;
            --border: #eef1f6;
            --border-focus: #e2f3e2;
            
            --text: #3a4354;
            --muted: #3a4354;
            
            --accent-pastel: #cbdcf7;
            --accent-text: #4a6fa5;
            --accent-hover: #b8cff5;
            
            --success-bg: #e2f3e2;
            --success-text: #437043;
            
            --error-bg: #fce7e3;
            --error-border: #f7ced6;
            --error-text: #a84c4c;
            
            --link-color: #557fa8;
        }

        body {
            font-family: 'Sora', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            
            /* Alineación a la izquierda limpia */
            justify-content: flex-start; 
            padding: 1.5rem 1.5rem 1.5rem 10%;
            
            /* Configuración del Fondo (Asegúrate de renombrar la imagen a fondo.jpg) */
            background-color: var(--bg);
            background-image: url('/img/fondo.jpg');
            background-repeat: no-repeat;
            background-position: right center;
            background-size: contain;
            background-attachment: fixed;
        }

        .wrapper {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(160, 175, 195, 0.15);
        }

        .card-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.4rem;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid transparent;
        }
        .alert-error {
            background: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error-text);
        }
        .alert-success {
            background: var(--success-bg);
            border-color: #d0ebd0;
            color: var(--success-text);
        }
        .alert svg { width: 16px; height: 16px; flex-shrink: 0; }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
            display: flex;
        }
        .input-icon svg { width: 16px; height: 16px; }

        /* AQUÍ SE AGREGÓ EL CORTE PARA INPUT DE TIPO TEXT */
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            color: var(--text);
            font-family: 'Sora', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: var(--border-focus);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(203, 220, 247, 0.4);
        }
        input::placeholder { color: #b0bac9; }

         .show-pass {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: var(--muted); padding: 4px; display: flex;
        }
        .show-pass svg { width: 16px; height: 16px; }
        
         .strength-bar {
            display: flex; gap: 4px; margin-top: 6px;
        }
        .strength-seg {
            height: 3px; flex: 1; border-radius: 2px;
            background: rgba(0,0,0,0.05);
            transition: background 0.3s;
        }
        .strength-label {
            font-size: 0.75rem; color: var(--muted); margin-top: 4px;
        }

  
        .btn-primary {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent-pastel);
            border: 1px solid rgba(0,0,0,0.03);
            border-radius: 10px;
            color: var(--accent-text);
            font-family: 'Sora', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.75rem;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:active { transform: scale(0.99); }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 1.75rem 0 1.5rem;
            color: var(--muted);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .register-link {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .register-link a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover { text-decoration: underline; }

        /* Responsivo para móviles */
        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding: 1.5rem;
                background-position: center;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <div class="card-header">
                <h1 class="card-title">Bienvenido de vuelta</h1>
                <p class="card-subtitle">Ingresa tus credenciales para continuar</p>
            </div>

            <div class="alert alert-error" th:if="${error}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span th:text="${error}">Correo o contraseña incorrectos.</span>
            </div>
            <div class="alert alert-success" th:if="${mensaje}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                <span th:text="${mensaje}">Sesión cerrada correctamente.</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                        <input type="email" id="correo" name="correo" placeholder="@gmail.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                        </span>
                        <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="show-pass" onclick="togglePass()" aria-label="Mostrar contraseña">
                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
               
                </div>

                <button type="submit" class="btn-primary">Iniciar sesión</button>
            </form>

            <div class="divider">o</div>
            <p class="register-link">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate gratis</a></p>
        </div>
    </div>

    <script>
        function togglePass() {
            const input = document.getElementById('contrasena');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }
    </script>
</body>
</html>
