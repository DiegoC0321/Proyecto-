<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .navbar { height: 52px; }
        .nav-link { color: rgba(255,255,255,0.85) !important; font-size: 0.9rem; }
        .nav-link:hover { color: #fff !important; }
        .nav-link.active { color: #fff !important; font-weight: 600; }
        .usuario-badge { font-size: 0.85rem; color: rgba(255,255,255,0.75); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold me-4" href="#"> GestorApp</a>
    <ul class="navbar-nav me-auto">
        <li class="nav-item">
            <a class="nav-link active" th:href="@{/dashboard}">
                <i class="bi bi-house"></i> Inicio
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">
                <i class="bi bi-folder"></i> Proyectos
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">
                <i class="bi bi-check2-square"></i> Tareas
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">
                <i class="bi bi-tags"></i> Etiquetas
            </a>
        </li>
    </ul>
    <div class="d-flex align-items-center gap-3">
        <span class="usuario-badge">
            <i class="bi bi-person-circle"></i>
            <span sec:authentication="name">usuario</span>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right"></i> Salir
            </button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h5 class="text-muted">Bienvenido</h5>
    <p>Acá irá el tablero con tus proyectos.</p>
</div>

</body>
</html>
