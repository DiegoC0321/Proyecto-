<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyecto</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            color: #1e2330;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: url('/img/dashboard.jpg') center/cover no-repeat fixed;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: rgba(245, 235, 248, 0.5);
            pointer-events: none; z-index: 0;
        }

        .card {
            position: relative; z-index: 1;
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%; max-width: 480px;
            box-shadow: 0 12px 32px rgba(100,80,140,0.1);
        }

        h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.45rem; font-weight: 400;
            color: #1e2330;
            margin-bottom: 1.75rem;
        }

        label {
            display: block; font-size: 0.78rem; font-weight: 600;
            color: #8492a6; text-transform: uppercase; letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
        }

        input[type="text"], textarea {
            width: 100%;
            border: 1px solid rgba(196,181,244,0.4);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
            color: #1e2330; background: rgba(255,255,255,0.7);
            outline: none; margin-bottom: 1.25rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        textarea { resize: vertical; min-height: 90px; }
        input:focus, textarea:focus {
            border-color: #c4b5f4;
            box-shadow: 0 0 0 3px rgba(196,181,244,0.25);
            background: rgba(255,255,255,0.9);
        }

        .actions { display: flex; gap: 10px; margin-top: 0.5rem; }

        .btn {
            padding: 0.65rem 1.3rem; border-radius: 10px; border: none;
            font-family: 'DM Sans', sans-serif; font-size: 0.87rem; font-weight: 600;
            cursor: pointer; text-decoration: none; display: inline-block;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn:hover { opacity: 0.88; transform: translateY(-1px); }

        .btn-primary {
            background: linear-gradient(135deg, #c4b5f4, #93c5fd);
            color: #fff;
            box-shadow: 0 2px 8px rgba(196,181,244,0.4);
        }
        .btn-ghost {
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.5);
            color: #3d4557;
        }
    </style>
</head>
<body>
<div class="card">
    <h2 th:text="${proyecto.id != null ? 'Editar Proyecto' : 'Nuevo Proyecto'}">Proyecto</h2>
    <form th:action="@{/proyectos/guardar}" method="post" th:object="${proyecto}">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Nombre del proyecto</label>
        <input type="text" th:field="*{nombre}" placeholder="Ej: Proyecto Bases de Datos" required/>
        <label>Descripción (opcional)</label>
        <textarea th:field="*{descripcion}" placeholder="Describe brevemente el proyecto..."></textarea>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/proyectos}" class="btn btn-ghost">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
