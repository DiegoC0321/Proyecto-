<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyecto</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sora', sans-serif; background: #f5f7fa; color: #3a4354; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #FCFCBB; border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(160,175,195,0.15); }
        h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 0.4rem; color: #6b7280; }
        input[type="text"], textarea { width: 100%; border: 1px solid #eef1f6; border-radius: 10px; padding: 0.75rem 1rem; font-family: 'Sora', sans-serif; font-size: 0.9rem; color: #3a4354; background: #fafbfc; outline: none; margin-bottom: 1.25rem; }
        textarea { resize: vertical; min-height: 90px; }
        input:focus, textarea:focus { border-color: #b3c8f2; box-shadow: 0 0 0 3px rgba(203,220,247,0.4); }
        .actions { display: flex; gap: 10px; margin-top: 0.5rem; }
        .btn { padding: 0.7rem 1.2rem; border-radius: 10px; border: none; font-family: 'Sora', sans-serif; font-size: 0.88rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: #cbdcf7; color: #4a6fa5; }
        .btn-primary:hover { background: #b8cff5; }
        .btn-ghost { background: #eef1f6; color: #3a4354; }
        .btn-ghost:hover { background: #e2e6ed; }
    </style>
</head>
<body>
<div class="card">
    <h2 th:text="${proyecto.id != null ? 'Editar Proyecto' : 'Nuevo Proyecto'}">Proyecto</h2>
    <form th:action="@{/proyectos/guardar}" method="post" th:object="${proyecto}">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Nombre del proyecto</label>
        <input type="text" th:field="*{nombre}" placeholder="Ej: Proyecto Bases de Datos" required/>
        <label>Descripción (opcional)</label>
        <textarea th:field="*{descripcion}" placeholder="Describe brevemente el proyecto..."></textarea>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/proyectos}" class="btn btn-ghost">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
