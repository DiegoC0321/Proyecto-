<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Proyectos</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --rose-soft: #fce8ed;
            --lavender:  #c4b5f4;
            --lav-soft:  #ede9fd;
            --sky:       #93c5fd;
            --sky-soft:  #dbeafe;
            --sage-soft: #dcfce7;
            --peach-soft:#ffedd5;
            --ink:    #1e2330;
            --body:   #3d4557;
            --muted:  #8492a6;
            --border: rgba(255,255,255,0.45);
            --glass2: rgba(255,255,255,0.80);
            --sidebar-w: 230px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            color: var(--ink);
            display: flex;
            min-height: 100vh;
            background: url('/img/dashboard.jpg') center/cover no-repeat fixed;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: rgba(245, 235, 248, 0.45);
            pointer-events: none; z-index: 0;
        }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--glass2);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            padding: 1.75rem 1rem 1.5rem;
            position: fixed; top: 0; left: 0; bottom: 0; z-index: 20;
        }
        .sidebar-logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1.25rem; color: var(--ink);
            margin-bottom: 2rem; padding: 0 0.5rem;
            display: flex; align-items: center; gap: 8px;
        }
        .nav-label {
    font-size: 0.68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); padding: 0 0.6rem;
    margin-bottom: 0.4rem; margin-top: 1.2rem;
}
        .sidebar-logo span { font-size: 1.4rem; }
        .nav-item {
            display: flex; align-items: center; gap: 9px;
            padding: 0.6rem 0.75rem; border-radius: 10px;
            font-size: 0.86rem; font-weight: 500;
            color: var(--body); text-decoration: none;
            margin-bottom: 2px; transition: background 0.15s;
        }
        .nav-item:hover { background: rgba(255,255,255,0.7); color: var(--ink); }
        .nav-item.active {
            background: linear-gradient(135deg, var(--lav-soft), var(--sky-soft));
            color: #5b3fc4; font-weight: 600;
            box-shadow: 0 2px 8px rgba(196,181,244,0.25);
        }
        .sidebar-bottom { margin-top: auto; }
        .user-card {
            display: flex; align-items: center; gap: 9px;
            padding: 0.75rem; border-radius: 12px;
            background: linear-gradient(135deg, var(--rose-soft), var(--lav-soft));
            border: 1px solid rgba(242,167,184,0.3);
        }
        .avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: linear-gradient(135deg, var(--lavender), #f2a7b8);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 700; color: #fff; flex-shrink: 0;
        }
        .user-name { font-size: 0.82rem; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .logout-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 0.85rem; padding: 4px; border-radius: 6px; transition: color 0.15s; }
        .logout-btn:hover { color: #ef4444; }

        /* MAIN */
        .main { margin-left: var(--sidebar-w); flex: 1; padding: 2rem 2rem 3rem; position: relative; z-index: 1; }

        .topbar {
            display: flex; align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .topbar-left h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.75rem; color: var(--ink);
        }
        .topbar-left p { font-size: 0.82rem; color: var(--muted); margin-top: 3px; }

        .btn-accent {
            display: inline-flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg, var(--lavender), var(--sky));
            border: none; border-radius: 10px;
            padding: 0.55rem 1.2rem;
            font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
            color: #fff; font-weight: 600; cursor: pointer; text-decoration: none;
            box-shadow: 0 2px 10px rgba(196,181,244,0.4);
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn-accent:hover { opacity: 0.9; transform: translateY(-1px); }

        /* BANNER MOTIVACIONAL EN PROYECTOS */
        .motivacion-banner {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1.25rem 1.75rem;
            margin-bottom: 2rem;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(252,232,237,0.6), rgba(237,233,253,0.6));
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 4px 15px rgba(196,181,244,0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .motivacion-banner-icon {
            font-size: 2.2rem;
            flex-shrink: 0;
        }
        .motivacion-banner-content {
            flex: 1;
        }
        .motivacion-banner-title {
            font-size: 1rem;
            font-weight: 700;
            color: #5b3fc4;
            margin-bottom: 4px;
        }
        .motivacion-banner-text {
            font-size: 0.85rem;
            color: var(--body);
            font-weight: 500;
        }

        /* GRID */
        .proyectos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.1rem;
        }

        .proj-card { border-radius: 20px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
        .proj-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.09); }

        .proj-card:nth-child(4n+1) { background: linear-gradient(145deg, #fce8ed, #ede9fd); border: 1px solid rgba(242,167,184,0.3); }
        .proj-card:nth-child(4n+2) { background: linear-gradient(145deg, #dbeafe, #ede9fd); border: 1px solid rgba(147,197,253,0.3); }
        .proj-card:nth-child(4n+3) { background: linear-gradient(145deg, #dcfce7, #dbeafe); border: 1px solid rgba(134,239,172,0.3); }
        .proj-card:nth-child(4n+4) { background: linear-gradient(145deg, #ffedd5, #fce8ed); border: 1px solid rgba(253,186,116,0.3); }

        .proj-card-top { padding: 1.4rem 1.4rem 0.6rem; }
        .proj-card-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(255,255,255,0.7);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; margin-bottom: 0.8rem;
        }
        .proj-card-name { font-size: 1rem; font-weight: 700; color: var(--ink); margin-bottom: 0.3rem; }
        .proj-card-desc {
            font-size: 0.8rem; color: var(--body); min-height: 32px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* BARRA DE AVANCE */
        .proj-progress { margin-top: 0.85rem; }
        .proj-progress-label {
            display: flex; justify-content: space-between;
            font-size: 0.72rem; color: #8492a6; font-weight: 500;
            margin-bottom: 5px;
        }
        .proj-progress-track {
            height: 6px; border-radius: 99px;
            background: rgba(0,0,0,0.07); overflow: hidden;
        }
        .proj-progress-fill {
            height: 100%; border-radius: 99px;
            background: linear-gradient(90deg, #c4b5f4, #93c5fd);
            transition: width 0.6s ease;
        }
        .proj-progress-fill.done { background: linear-gradient(90deg, #86efac, #34d399); }

        /* FOOTER TARJETA */
        .proj-card-footer {
            padding: 0.9rem 1.4rem;
            display: flex; gap: 6px; align-items: center;
        }
        .btn-sm {
            font-size: 0.76rem; padding: 0.38rem 0.9rem;
            border-radius: 8px; border: none; cursor: pointer;
            font-family: 'DM Sans', sans-serif; font-weight: 600;
            text-decoration: none; display: inline-flex; align-items: center;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn-sm:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-tasks { background: rgba(255,255,255,0.85); color: #5b3fc4; }
        .btn-edit  { background: rgba(255,255,255,0.6);  color: var(--body); }
        .btn-del   { background: rgba(239,68,68,0.1); color: #dc2626; margin-left: auto; }
        .btn-del:hover { background: rgba(239,68,68,0.18); }

        /* EMPTY */
        .empty {
            grid-column: 1 / -1; text-align: center;
            padding: 4rem 2rem;
            background: var(--glass2); backdrop-filter: blur(12px);
            border-radius: 20px; border: 1px solid var(--border);
            color: var(--muted);
        }
        .empty p { font-size: 0.9rem; margin-bottom: 0.5rem; }
        .empty a { color: #6b48c8; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo"><span>✦</span> GestorApp</div>
    
    <p class="nav-label">Principal</p> 
    
    <a class="nav-item" th:href="@{/dashboard}">🏠 Inicio</a>
    <a class="nav-item active" th:href="@{/proyectos}">📁 Proyectos</a>
    
    <div class="sidebar-bottom">
        <div class="user-card">
            <div class="avatar" th:text="${usuarioConectado != null ? #strings.toUpperCase(#strings.substring(usuarioConectado.nombre,0,1)) : 'U'}">U</div>
            <div class="user-name" th:text="${usuarioConectado?.nombre}">Usuario</div>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="logout-btn">✕</button>
            </form>
        </div>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <div class="topbar-left">
            <h1>Mis Proyectos</h1>
            <p>Gestiona y organiza todos tus proyectos</p>
        </div>
        <a th:href="@{/proyectos/nuevo}" class="btn-accent">+ Nuevo proyecto</a>
    </div>

    <div class="motivacion-banner">
        <div class="motivacion-banner-icon" id="iconoMotivacional">✨</div>
        <div class="motivacion-banner-content">
            <div class="motivacion-banner-title">Sigue avanzando</div>
            <div class="motivacion-banner-text" id="mensajeMotivacional">
                Cargando mensaje...
            </div>
        </div>
    </div>

    <div class="proyectos-grid" th:if="${!proyectos.isEmpty()}">
        <div class="proj-card" th:each="p : ${proyectos}">
            <div class="proj-card-top">
                <div class="proj-card-icon">📁</div>
                <div class="proj-card-name" th:text="${p.nombre}">Nombre</div>
                <div class="proj-card-desc" th:text="${p.descripcion ?: 'Sin descripción'}">Desc</div>

                <div class="proj-progress" th:with="datos=${progreso != null ? progreso[p.id] : null}">
                    <div class="proj-progress-label">
                        <span>Progreso</span>
                        <span th:text="${datos != null && datos[1] > 0} ? ${datos[0]} + ' / ' + ${datos[1]} + ' tareas' : 'Sin tareas'">0 / 0</span>
                    </div>
                    <div class="proj-progress-track">
                        <div class="proj-progress-fill"
                             th:classappend="${datos != null && datos[1] > 0 && datos[0] == datos[1]} ? 'done'"
                             th:style="${datos != null && datos[1] > 0} ? 'width:' + ${(datos[0] * 100 / datos[1])} + '%' : 'width:0%'">
                        </div>
                    </div>
                </div>
            </div>

            <div class="proj-card-footer">
                <a th:href="@{/tareas/proyecto/{id}(id=${p.id})}" class="btn-sm btn-tasks">Ver tareas</a>
                <a th:href="@{/proyectos/editar/{id}(id=${p.id})}" class="btn-sm btn-edit">Editar</a>
                <form th:action="@{/proyectos/eliminar/{id}(id=${p.id})}" method="post" style="margin-left:auto;display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-sm btn-del"
                            onclick="return confirm('¿Eliminar proyecto?')">Eliminar</button>
                </form>
            </div>
        </div>
    </div>

    <div class="proyectos-grid" th:if="${proyectos.isEmpty()}">
        <div class="empty">
            <p>No tienes proyectos aún. ¡Crea el primero!</p>
            <a th:href="@{/proyectos/nuevo}">+ Crear proyecto →</a>
        </div>
    </div>
</main>

<script>
    const hora = new Date().getHours();
    const mensaje = document.getElementById("mensajeMotivacional");
    const icono = document.getElementById("iconoMotivacional");

    if (mensaje && icono) {
        if (hora < 12) {
            icono.textContent = "🌞";
            mensaje.textContent = "Comienza el día organizando tus tareas en tus proyectos.";
        } else if (hora < 18) {
            icono.textContent = "🚀";
            mensaje.textContent = "Mantén el ritmo, vas avanzando muy bien con tus entregas.";
        } else {
            icono.textContent = "🌙";
            mensaje.textContent = "Revisa los logros de tus proyectos hoy y prepárate para mañana.";
        }
    }
</script>

</body>
</html>
