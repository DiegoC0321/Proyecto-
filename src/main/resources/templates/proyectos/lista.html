<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Proyectos</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sora', sans-serif; background: #f5f7fa; color: #3a4354; }
        .sidebar { width: 240px; background: #fff; border-right: 1px solid #FCFCBB; display: flex; flex-direction: column; padding: 2rem 1rem 1.5rem; position: fixed; top: 0; left: 0; bottom: 0; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 0.7rem 0.75rem; border-radius: 10px; font-size: 0.88rem; color: #3a4354; text-decoration: none; margin-bottom: 4px; }
        .nav-item:hover { background: #fafbfc; }
        .nav-item.active { background: #cbdcf7; color: #4a6fa5; font-weight: 500; }
        .sidebar-bottom { margin-top: auto; }
        .user-card { display: flex; align-items: center; gap: 10px; padding: 0.8rem; border-radius: 12px; background: #FCFCBB; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #cbdcf7; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; color: #4a6fa5; }
        .user-name { font-size: 0.85rem; font-weight: 600; }
        .logout-btn { background: none; border: none; cursor: pointer; color: #8a99ad; padding: 4px; display: flex; }
        .logout-btn:hover { color: #ef4444; }
        .main { margin-left: 240px; padding: 2rem; }
        .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
        .topbar-title { font-size: 1.4rem; font-weight: 600; }
        .btn-accent { display: flex; align-items: center; gap: 8px; background: #cbdcf7; border: none; border-radius: 8px; padding: 0.6rem 1.1rem; font-family: 'Sora', sans-serif; font-size: 0.85rem; color: #4a6fa5; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn-accent:hover { background: #b8cff5; }
        .proyectos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
        .proj-card { background: #fff; border: 1px solid #FCFCBB; border-radius: 14px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .proj-card-name { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .proj-card-desc { font-size: 0.83rem; color: #8a99ad; margin-bottom: 1.25rem; min-height: 36px; }
        .proj-card-footer { display: flex; gap: 8px; }
        .btn-sm { font-size: 0.8rem; padding: 0.4rem 0.9rem; border-radius: 8px; border: none; cursor: pointer; font-family: 'Sora', sans-serif; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-blue { background: #cbdcf7; color: #4a6fa5; }
        .btn-blue:hover { background: #b8cff5; }
        .btn-red { background: #fce7e3; color: #a84c4c; }
        .btn-red:hover { background: #f9d0c8; }
        .empty { text-align: center; padding: 4rem; color: #8a99ad; }
    </style>
</head>
<body>
<aside class="sidebar">
    <a class="nav-item" th:href="@{/dashboard}">🏠 Inicio</a>
    <a class="nav-item active" th:href="@{/proyectos}">📁 Proyectos</a>
    <div class="sidebar-bottom">
        <div class="user-card">
            <div class="avatar" th:text="${usuarioConectado != null ? #strings.toUpperCase(#strings.substring(usuarioConectado.nombre,0,1)) : 'U'}">U</div>
            <div class="user-name" th:text="${usuarioConectado?.nombre}">Usuario</div>
            <form th:action="@{/logout}" method="post" style="margin-left:auto">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="logout-btn">✕</button>
            </form>
        </div>
    </div>
</aside>
<main class="main">
    <div class="topbar">
        <h1 class="topbar-title">Mis Proyectos</h1>
        <a th:href="@{/proyectos/nuevo}" class="btn-accent">+ Nuevo proyecto</a>
    </div>
    <div class="proyectos-grid" th:if="${!proyectos.isEmpty()}">
        <div class="proj-card" th:each="p : ${proyectos}">
            <div class="proj-card-name" th:text="${p.nombre}">Nombre</div>
            <div class="proj-card-desc" th:text="${p.descripcion ?: 'Sin descripción'}">Desc</div>
            <div class="proj-card-footer">
                <a th:href="@{/tareas/proyecto/{id}(id=${p.id})}" class="btn-sm btn-blue">Ver tareas</a>
                <a th:href="@{/proyectos/editar/{id}(id=${p.id})}" class="btn-sm btn-blue">Editar</a>
                <form th:action="@{/proyectos/eliminar/{id}(id=${p.id})}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-sm btn-red" onclick="return confirm('¿Eliminar proyecto?')">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
    <div class="empty" th:if="${proyectos.isEmpty()}">
        <p>No tienes proyectos aún. ¡Crea el primero!</p>
    </div>
</main>
</body>
</html>
