<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Tarea</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sora', sans-serif; background: #f5f7fa; color: #3a4354; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #FCFCBB; border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(160,175,195,0.15); }
        h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 0.4rem; color: #6b7280; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; border: 1px solid #eef1f6; border-radius: 10px; padding: 0.75rem 1rem; font-family: 'Sora', sans-serif; font-size: 0.9rem; color: #3a4354; background: #fafbfc; outline: none; margin-bottom: 1.25rem; }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, select:focus, textarea:focus { border-color: #b3c8f2; box-shadow: 0 0 0 3px rgba(203,220,247,0.4); }
        .etiquetas-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.25rem; }
        .etiqueta-check { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; cursor: pointer; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .actions { display: flex; gap: 10px; margin-top: 0.5rem; }
        .btn { padding: 0.7rem 1.2rem; border-radius: 10px; border: none; font-family: 'Sora', sans-serif; font-size: 0.88rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: #cbdcf7; color: #4a6fa5; }
        .btn-primary:hover { background: #b8cff5; }
        .btn-ghost { background: #eef1f6; color: #3a4354; }
        .btn-ghost:hover { background: #e2e6ed; }
    </style>
</head>
<body>
<div class="card">
    <h2>Nueva Tarea — <span th:text="${proyecto.nombre}"></span></h2>
    <form th:action="@{/tareas/guardar/{id}(id=${proyecto.id})}" method="post" th:object="${tarea}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Título</label>
        <input type="text" th:field="*{titulo}" placeholder="Ej: Diseñar el DER" required/>
        <label>Descripción (opcional)</label>
        <textarea th:field="*{descripcion}" placeholder="Detalles de la tarea..."></textarea>
        <label>Fecha límite (opcional)</label>
        <input type="date" th:field="*{fechaLimite}"/>
        <label>Estado</label>
        <select th:field="*{estado.id}">
            <option th:each="e : ${estados}" th:value="${e.id}" th:text="${e.nombreEstado}">Estado</option>
        </select>
        <label>Etiquetas</label>
        <div class="etiquetas-grid">
            <label class="etiqueta-check" th:each="e : ${etiquetas}">
                <input type="checkbox" name="etiquetaIds" th:value="${e.id}"/>
                <span class="dot" th:style="'background:' + ${e.colorHex}"></span>
                <span th:text="${e.nombre}">Tag</span>
            </label>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Guardar tarea</button>
            <a th:href="@{/tareas/proyecto/{id}(id=${proyecto.id})}" class="btn btn-ghost">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
